name: Update market data

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python fetch_prices.py
      - run: python alerts.py
      - name: Commit updated data
        run: |
          git config user.name "market-agent"
          git config user.email "market-agent@users.noreply.github.com"
          git add data.json alerts.json
          git diff --staged --quiet || git commit -m "Update market data"
          git push
